[plugin]
id = "com.ghost-him.windows-settings"
name = "Windows 系统设置"
version = "0.1.1"
description = "把常用 Windows 设置页（Wi-Fi、蓝牙、显示、更新等）加入搜索，执行时经 cmd 打开对应设置页；可在设置中逐项勾选启用项"
author = "ghost-him"
# 不参与触发词路由：候选项由 data_source 组件直接进入搜索管道
mode = "inline"
triggerKeywords = []
supportedOs = ["windows"]
priority = 100

[runtime]
command = "bin/zerolaunch-plugin-windows-settings.exe"
args = []
startupTimeout = 10
autoRestart = true
maxRestart = 3

[components]
provides = ["plugin", "data_source"]

[icon]
# 插件图标（相对插件目录；随包分发，Release 一同上传同名附件供市场卡片展示）
path = "icon.svg"
